name: Tarea
description: Una tarea de un solo propósito que cabe en un PR de máximo 400 líneas.
title: "tipo(area): descripción corta"
labels: ["tarea"]
projects: ["Telivia-Labs/2"]
body:
  - type: markdown
    attributes:
      value: |
        Un propósito por tarea. Si el título lleva «y», son dos tareas.
        Límites: PR de máximo 400 líneas sin contar lo generado (si es más, PR consecutivos «N de M»);
        código nuevo o tocado de máximo 100 caracteres por línea, 300 líneas por archivo y 50 por función.
        Lo que no se sabe se escribe «por confirmar»; no se inventa.
        Los agentes no llenan esto a mano: usan `scripts/nueva-tarea.js` del orquestador.
  - type: textarea
    id: que
    attributes:
      label: Qué
      description: Qué debe existir al terminar, en una o dos frases.
    validations:
      required: true
  - type: input
    id: para-quien
    attributes:
      label: Para quién
      description: Quién lo usa o lo pidió (Juan, el equipo, un cliente, un rol).
    validations:
      required: true
  - type: textarea
    id: invariante
    attributes:
      label: Qué debe ser siempre cierto
      description: "2 o 3 frases. Ej.: un cobro nunca supera el saldo de la factura."
    validations:
      required: true
  - type: input
    id: carpeta
    attributes:
      label: Carpeta del área
      description: "Dónde vive el cambio. Ej.: src/funcionalidades/cobros/"
    validations:
      required: true
  - type: dropdown
    id: fase
    attributes:
      label: Fase
      options: ["Fase 0", "Fase 1", "Agentes", "Fase 2", "Fase 3"]
    validations:
      required: true
  - type: dropdown
    id: agente
    attributes:
      label: Agente
      options: ["Claude", "Codex"]
    validations:
      required: true
  - type: input
    id: tamano
    attributes:
      label: Tamaño estimado
      description: Líneas cambiadas, sin contar lo generado. Máximo 400; si es más, son varias tareas.
      placeholder: "120"
    validations:
      required: true
  - type: textarea
    id: riesgos
    attributes:
      label: Riesgos
      description: Qué puede salir mal y si toca dinero, permisos, base de datos o producción.
    validations:
      required: true
