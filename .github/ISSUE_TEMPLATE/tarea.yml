name: Tarea
description: Un solo propósito que cabe en un PR de máximo 400 líneas.
title: "tipo(area): descripción corta"
labels: ["tarea"]
body:
  - type: markdown
    attributes:
      value: |
        Un propósito por tarea. Si el título lleva «y», son dos tareas.
        Límites: PR de 400 líneas; código de 100 caracteres por línea, 300 líneas por archivo y 50
        por función. Lo que no se sabe se escribe «por confirmar»; no se inventa.
  - type: textarea
    id: que
    attributes:
      label: Qué
      description: Qué debe existir al terminar, en una o dos frases.
    validations:
      required: true
  - type: textarea
    id: por-que
    attributes:
      label: Por qué
      description: Para quién es y qué problema resuelve.
    validations:
      required: true
  - type: textarea
    id: invariante
    attributes:
      label: Qué debe ser siempre cierto
      description: "2 o 3 frases. Ej.: una empresa nunca ve facturas de otra."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Uno por línea, comprobable con una prueba.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: depende
    attributes:
      label: Depende de
      description: "Tareas que deben estar unidas antes. Ej.: #34. «Nada» si no hay."
    validations:
      required: true
  - type: dropdown
    id: tamano
    attributes:
      label: Tamaño
      options: ["S (hasta 100 líneas)", "M (hasta 250)", "L (hasta 400)"]
    validations:
      required: true
  - type: dropdown
    id: agente
    attributes:
      label: Agente
      options: ["Cerebro (Claude)", "Dexter (Codex)"]
    validations:
      required: true
  - type: textarea
    id: riesgos
    attributes:
      label: Riesgos
      description: Qué puede salir mal y si toca dinero, permisos, datos entre empresas o producción.
    validations:
      required: true
