name: pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Pruebas del revisor de calidad
        working-directory: calidad
        run: npm ci --silent && npm test
      - name: Pruebas de la revisión de estilos
        working-directory: estilos
        run: npm ci --silent && npm test
