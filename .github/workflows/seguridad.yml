# Revisiones gratis de seguridad (8 nov 2026, decisión de Juan: nada de pago).
#   secretos      gitleaks: claves o contraseñas en los commits del PR.
#   dependencias  OSV-Scanner: librerías con fallas conocidas en los lockfiles.
#   flujos        actionlint: los flujos de GitHub Actions bien escritos.
# Flujo reutilizable: cada repo lo llama en sus PR y en la cola de unión. Versiones fijas.
name: seguridad

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS: "8.21.2"
  OSV: "1.9.1"
  ACTIONLINT: "1.7.4"

jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CABEZA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          u=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSL "$u/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --source . --log-opts="$BASE..$CABEZA" --redact --no-banner

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OSV-Scanner
        run: |
          u=https://github.com/google/osv-scanner/releases/download
          curl -sSL -o osv-scanner "$u/v${OSV}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          ./osv-scanner --recursive --skip-git .

  flujos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          u=https://github.com/rhysd/actionlint/releases/download
          curl -sSL "$u/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" | tar xz actionlint
          ./actionlint -color
