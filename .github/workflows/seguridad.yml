# Revisiones gratis de seguridad (8 nov 2026, decisión de Juan: nada de pago).
#   secretos      gitleaks: claves o contraseñas en los commits del PR.
#   dependencias  OSV-Scanner: librerías con fallas conocidas en los lockfiles.
#   flujos        actionlint: los flujos de GitHub Actions bien escritos.
# Flujo reutilizable: cada repo lo llama en sus PR y en la cola de unión. Versiones fijas.
name: seguridad

on:
  workflow_call:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}
  GITLEAKS: "8.21.2"
  OSV: "1.9.1"
  ACTIONLINT: "1.7.4"

jobs:
  secretos:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CABEZA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          gh release download "v${GITLEAKS}" -R gitleaks/gitleaks \
            -p "gitleaks_${GITLEAKS}_linux_x64.tar.gz" -O - | tar xz gitleaks
          ./gitleaks detect --source . --log-opts="$BASE..$CABEZA" --redact --no-banner

  dependencias:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: OSV-Scanner (solo fallas nuevas del PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          gh release download "v${OSV}" -R google/osv-scanner -p osv-scanner_linux_amd64 \
            -O "$RUNNER_TEMP/osv"
          chmod +x "$RUNNER_TEMP/osv"
          escanear() { "$RUNNER_TEMP/osv" --format json --recursive --skip-git . > "$1" || true; }
          escanear "$RUNNER_TEMP/cabeza.json"
          git checkout -q "$BASE"
          escanear "$RUNNER_TEMP/base.json"
          python3 - "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/cabeza.json" <<'PY'
          import json, sys
          def fallas(f):
              try:
                  d = json.load(open(f))
              except Exception:
                  return {}
              out = {}
              for r in d.get('results', []):
                  for p in r.get('packages', []):
                      for v in p.get('vulnerabilities', []):
                          nombre = p['package']['name']
                          out[(v['id'], nombre)] = r['source']['path']
              return out
          base, cabeza = fallas(sys.argv[1]), fallas(sys.argv[2])
          nuevas = sorted(set(cabeza) - set(base))
          print(f'Fallas conocidas: {len(cabeza)} en total, {len(nuevas)} nuevas en este PR.')
          for i, n in nuevas:
              print(f'- {i} en {n} ({cabeza[(i, n)]})')
          sys.exit(1 if nuevas else 0)
          PY

  flujos:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          gh release download "v${ACTIONLINT}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT}_linux_amd64.tar.gz" -O - | tar xz actionlint
          SHELLCHECK_OPTS="--severity=warning" ./actionlint -color
