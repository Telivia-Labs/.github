# Revisor de forma de Telivia (Telivia/.github): título, secciones, tamaño, tarea enlazada y
# límites del código nuevo de cada PR. En la cola de unión pasa sin repetir.
name: revisar-forma
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  forma:
    uses: Telivia/.github/.github/workflows/forma.yml@main
