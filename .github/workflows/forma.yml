# Revisor de forma reutilizable. Cada repo lo llama con un flujo corto (ver README):
#   PR: título Conventional Commits en inglés (≤ 72), secciones de la plantilla, ≤ 400 líneas sin
#   lo generado, tarea enlazada y código nuevo con líneas ≤ 100 y archivos nuevos ≤ 300.
#   Tareas: campos obligatorios del formulario.
name: forma
on:
  workflow_call:
    inputs:
      generados:
        description: "Patrones extra que no cuentan como líneas, separados por coma (dir/, *.ext)"
        type: string
        default: ""
      ref:
        description: "Versión de revisar.js (rama, etiqueta o commit); no sigue al @ref de uses"
        type: string
        default: main
permissions:
  contents: read
  pull-requests: read
  issues: write
jobs:
  forma:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    # En la cola de unión no hay PR ni tarea: pasa sin revisar (ya se revisó en el PR) para que la
    # cola no se quede esperando una revisión obligatoria.
    env:
      EN_COLA: ${{ github.event_name == 'merge_group' }}
    steps:
      - name: En la cola de unión no se repite
        if: env.EN_COLA == 'true'
        run: echo "Forma ya revisada en el PR."

      - uses: actions/checkout@v4
        if: env.EN_COLA != 'true'
        with:
          repository: Telivia/.github
          ref: ${{ inputs.ref }}
          path: .forma
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.EN_COLA != 'true'
        with:
          node-version: 22
      - id: revisar
        if: env.EN_COLA != 'true'
        run: node .forma/forma/revisar.js
        env:
          GH_TOKEN: ${{ github.token }}
          GENERADOS: ${{ inputs.generados }}
      - name: Avisar en la tarea
        if: >-
          failure() && steps.revisar.outcome == 'failure' && steps.revisar.outputs.fallas != ''
          && github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          FALLAS: ${{ steps.revisar.outputs.fallas }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          {
            printf 'La tarea no tiene la forma de Telivia:\n\n%s\n\n' "$FALLAS"
            printf 'Edítala y el revisor vuelve a mirar.\n'
          } > aviso.md
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file aviso.md
